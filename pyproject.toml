[project]
name = "secrets-router"
version = "0.1.0"
description = "Credential isolation for agent workflows"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "pyyaml",
    "websockets>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
secrets-router = "server:main"

[tool.setuptools]
py-modules = ["server", "engine"]
packages = ["actuators"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
